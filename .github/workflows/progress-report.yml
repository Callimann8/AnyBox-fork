name: Progress report

on:
  pull_request:
    paths:
      - core/libs/**
      - tools/anybox_scan.py
      - tools/progress.py

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare base and head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python tools/progress.py --json > "$RUNNER_TEMP/head.json"
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/base" && python tools/progress.py --json > "$RUNNER_TEMP/base.json") || echo '{"totals":{"implemented":0,"forwarded":0,"declared":0,"percent":0},"libraries":[]}' > "$RUNNER_TEMP/base.json"
          python tools/progress.py --compare "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" | tee -a "$GITHUB_STEP_SUMMARY"
