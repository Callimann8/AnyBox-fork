name: Pages

on:
  push:
    branches: [main]
    paths:
      - core/libs/**
      - tools/**
      - docs/needs/**
      - docs/inventory/**
      - .github/workflows/pages.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate progress
        run: |
          python tools/progress.py site
          python tools/progress_history.py site --ref HEAD
          python tools/needs.py site >> "$GITHUB_STEP_SUMMARY"
          cp site/progress.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
