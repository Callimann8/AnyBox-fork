name: Labels

on:
  push:
    branches: [main]
    paths: ['.github/workflows/labels.yml']
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          label() { gh label create "$1" --color "$2" --description "$3" --force; }

          label libs            1d76db 'core/libs: libraries, runtime and their tests'
          label relinker        5319e7 'core/relinker'
          label tools           fef2c0 'tools/'
          label docs            0075ca 'Documentation only'
          label ci              5319e7 '.github'
          label 'fixes issue'   d73a4a 'Closes an issue (Fixes #N)'
          label 'unblocks title' 2ea043 'Names a title ID on the Unblocks line'
          label 'needs rebase'  b60205 'Conflicts with main; rebase on current main'
          label stale           ededed 'Conflicting with main and no activity for 7 days'
