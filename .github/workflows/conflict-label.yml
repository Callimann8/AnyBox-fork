name: Conflict label

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: conflict-label
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
    steps:
      - uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: needs rebase
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          commentOnDirty: 'This pull request conflicts with `main`. Rebase it on current `main` and force-push the branch; the label is removed automatically once it merges cleanly.'
